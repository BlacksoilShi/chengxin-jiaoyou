<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title data-i18n="extName">诚信浇友</title>
  <style>
    body {
      margin: 0;
      width: 340px;
      font: 13px/1.4 system-ui, -apple-system, sans-serif;
      color: #111;
      background: #fff;
    }
    .wrap { padding: 12px; }
    h1 { margin: 0 0 8px; font-size: 14px; }
    p { margin: 0 0 8px; color: #555; }
    ul { margin: 0 0 10px; padding-left: 18px; color: #555; }
    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 9px 10px;
      background: #1d9bf0;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { filter: brightness(0.97); }
    button.secondary { background: #eef1f3; color: #b42318; margin-top: 6px; }
    button.ghost { background: #f7f9f9; color: #0f1419; margin-top: 6px; }
    button.sync { background: #5f8f7a; margin-top: 6px; }
    .meta { margin-top: 10px; color: #666; font-size: 12px; }
    label { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
    hr { border: 0; border-top: 1px solid #eee; margin: 10px 0; }
    .ix { color: #5f8f7a; font-weight: 700; }
    .ox { color: #6f63c9; font-weight: 700; }
    button.oxsync { background: #6f63c9; margin-top: 6px; }
    .tag-out { color: #6f63c9; font-weight: 700; }
    .note { color: #888; font-size: 11px; margin-top: 4px; }
    .acct {
      margin: 8px 0;
      padding: 8px;
      border-radius: 8px;
      background: #f0f7f4;
      color: #0f1419;
      font-size: 12px;
    }
    .acct b { color: #1d9bf0; }
    .dbg {
      margin-top: 8px;
      padding: 8px;
      border-radius: 8px;
      background: #f7f9f9;
      color: #536471;
      font-size: 11px;
      max-height: 160px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .dbg b { color: #0f1419; }
    .tag-reply { color: #1d9bf0; font-weight: 700; }
    .tag-like { color: #f91880; font-weight: 700; }
    .tag-quote { color: #7856ff; font-weight: 700; }
    .tag-thread { color: #00a3a3; font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1><span data-i18n="extName">诚信浇友</span> <span id="verLabel" style="color:#888;font-weight:500"></span></h1>
    <div data-i18n="extSubtitle" style="color:#888;font-size:11px;margin:-4px 0 6px">Honest Mutuals · X 关注与互动标注</div>
    <ul>
      <li data-i18n="popup_li_following">正在关注：橙色「未回关」</li>
      <li data-i18n="popup_li_followers">关注者：蓝色「蓝V待回关」</li>
      <li data-i18n="popup_li_ix">列表 + 时间线：被互动 N / 我互动 N（时间线简写「被 / 我」，悬停看分项）</li>
      <li data-i18n="popup_li_follow">时间线未关注作者：可点「关注」一键关注（popup 可关）</li>
    </ul>
    <label>
      <input type="checkbox" id="autoScan" checked />
      <span data-i18n="popup_autoScan">进入列表页自动扫描</span>
    </label>
    <label>
      <input type="checkbox" id="showInbound" checked />
      <span data-i18n="popup_showInbound">显示被互动（别人对你）</span>
    </label>
    <label>
      <input type="checkbox" id="showOutbound" checked />
      <span data-i18n="popup_showOutbound">显示我互动（你对别人）</span>
    </label>
    <label>
      <input type="checkbox" id="showQuickFollow" checked />
      <span data-i18n="popup_showQuickFollow">时间线显示「关注」按钮（未关注作者 · 仅点击时关注）</span>
    </label>
    <div class="note" data-i18n="popup_orderNote">顺序：关注 → 被互动 → 我互动。不自动批量关注；列表页已有原生按钮则不重复插入。</div>
    <button id="scan" data-i18n="popup_scan">扫描本页</button>
    <hr />
    <div class="acct" id="acctBox" data-i18n="popup_acctDetecting">当前账号：检测中…</div>
    <div class="note" data-i18n="popup_inboundNote">被互动说明</div>
    <button id="syncNow" class="sync" data-i18n="popup_syncNow">温和同步通知（较慢）</button>
    <div class="note" style="margin-top:8px" data-i18n="popup_outboundNote">我互动说明</div>
    <button id="oxSyncNow" class="oxsync" data-i18n="popup_oxSyncNow">同步我的互动（手动·较慢）</button>
    <button id="clearIx" class="secondary" data-i18n="popup_clearIx">清空本账号互动数据（被+我）</button>
    <button id="refreshDbg" class="ghost" data-i18n="popup_refreshDbg">刷新捕获状态</button>
    <div class="dbg" id="dbgBox" data-i18n="popup_dbgDefault">捕获状态默认</div>
    <div class="meta" id="status" data-i18n="popup_ready">就绪</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
